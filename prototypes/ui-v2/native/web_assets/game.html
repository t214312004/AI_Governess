<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>數字練習</title><style>body{background:#fffefa;color:#263e3b;font:22px 'Microsoft JhengHei',sans-serif;text-align:center;padding:8vh 20px}button{font-family:inherit;font-size:28px;padding:22px;margin:10px;border:1px solid #ced9d1;border-radius:12px;background:#e8f0e8;color:#263e3b}h1{font-size:26px}p{font-size:18px}</style><h1>數字練習</h1><h2 id="question"></h2><div id="answers"></div><p id="score" aria-live="polite"></p><script>
let state;try{state=JSON.parse(localStorage.getItem('native-demo-game'));}catch{}
if(!state||!Number.isInteger(state.a)||state.a<1||state.a>7||!Number.isInteger(state.b)||state.b<1||state.b>5||!Number.isSafeInteger(state.score)||state.score<0)state={a:3,b:4,score:0};
function render(){document.getElementById('question').textContent=`${state.a} + ${state.b} = ?`;document.getElementById('score').textContent=`已完成 ${state.score} 題`;const box=document.getElementById('answers');box.replaceChildren();for(const v of [state.a+state.b-1,state.a+state.b,state.a+state.b+2]){const b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(v===state.a+state.b){state.score=Math.min(Number.MAX_SAFE_INTEGER,state.score+1);state.a=state.a%7+1;state.b=state.b%5+1;try{localStorage.setItem('native-demo-game',JSON.stringify(state));}catch{document.getElementById('score').textContent='無法保存進度';return;}render();}else document.getElementById('score').textContent='再試一次';};box.append(b);}}render();
</script></html>
