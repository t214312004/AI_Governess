name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            ai_voice_assistant/requirements.txt
            ai_voice_assistant/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r ai_voice_assistant/requirements-dev.txt

      - name: Run tests
        working-directory: ai_voice_assistant
        run: python -m pytest -q
